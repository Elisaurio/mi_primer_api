
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EmpresaHub | Gestión empresarial</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="container py-5">

        <div class="mb-4">
            <h1>EmpresaHub</h1>
            <p class="text-muted">
                Sistema de gestión empresarial
            </p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="d-flex justify-content-between
                            align-items-center mb-3">
                    <h3>Gestión de clientes</h3>

                    <button class="btn btn-primary"
                            onclick="nuevoCliente()">
                        + Nuevo cliente
                    </button>
                </div>

                <input type="text"
                       id="busqueda"
                       class="form-control mb-3"
                       placeholder="Buscar cliente..."
                       oninput="filtrarClientes()">

                <div id="mensaje"></div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Teléfono</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaClientes"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mt-4" id="formulario">
            <div class="card-body">
                <h4 id="tituloFormulario">Nuevo cliente</h4>

                <form id="formCliente">
                    <input type="hidden" id="idCliente">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label>Nombre</label>
                            <input id="nombre"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-4">
                            <label>Apellido</label>
                            <input id="apellido"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-4">
                            <label>Teléfono</label>
                            <input id="telefono"
                                   class="form-control">
                        </div>
                    </div>

                    <div class="mt-3">
                        <button type="submit"
                                class="btn btn-success">
                            Guardar cliente
                        </button>

                        <button type="button"
                                class="btn btn-secondary"
                                onclick="limpiarFormulario()">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="/js/app.js"></script>
</body>
</html>
